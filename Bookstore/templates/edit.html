<!-- edit.html -->

{{define "title"}}Edit{{end}}
{{define "content"}}

<section class="center">
    <h1 class="headline-h1">Edit Book ✏️</h1>
</section>
<section class="container">
    <form action="/edit" method="POST">
        <input type="hidden" name="id" value="{{.Id}}">
        <p>
            <label>ISBN: </label>
            <input type="text" name="isbn" value="{{ .Isbn }}" required>
        </p>
        <p>
            <label>Title: </label>
            <input type="text" name="title" value="{{ .Title }}" required>
        </p>
        <p>
            <label>Author: </label>
            <input type="text" name="author" value="{{ .Author }}" required>
        </p>
        <p>
            <label>Price: </label></span>
            <input type="number" step="0.01" name="price" value="{{ .Price }}" required>
        </p>
        <p>
            <label>Excerpt: </label>
            <textarea name="excerpt" rows="5" cols="50" required>{{ .Excerpt }}</textarea>
        </p>
        <br><br>
        <input type="submit" value="Update">
    </form>
</section>

{{end}}
