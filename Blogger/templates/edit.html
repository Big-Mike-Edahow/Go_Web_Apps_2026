<!-- edit.html -->

{{define "title"}}Edit{{end}}
{{define "content"}}

<section class="center">
    <h1 class="headline-h1">Edit Post ✏️</h1>
</section>
<section>
    <form action="/update?id={{.Id}}" method="POST">
        <input type="hidden" name="id" value="{{.Id}}">
        <p>
            <label>Title: </label>
            <input type="text" name="title" value="{{.Title}}" required>
        </p>
        <p>
            <label>Content: </label>
            <textarea name="content" rows="3" cols="50" required>{{ .Content }}</textarea>
        </p>
        <br>
        <input type="submit" value="Update Post">
    </form>
</section>

{{end}}
