<!-- index.html -->

{{define "title"}}Home{{end}}
{{define "content"}}

<section class='center'>
    <h1 class="headline-h1">List of Students 📋</h1>
    <br>
    <hr><br><br>
    <table class="center">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Age</th>
                <th>Major</th>
                <th>Created</th>
                <th colspan="2">Actions</th>
            </tr>
        </thead>

        {{range .}}
        
        <tbody class="metadata">
            <tr>
                <td>#{{ .Id }}</td>
                <td><a href='/view?id={{ .Id }}'>{{ .Name }}</a></td>
                <td>{{ .Age }}</td>
                <td>{{ .Major }}</td>
                <td><time>{{.Created.Format "Monday, Jan 2, 2006"}}</time></td>
                <td><a class="button" href="/edit?id={{.Id}}">Edit</a></td>
                <td><a class="button" href="/delete?id={{ .Id }}">Delete</a></td>
            </tr>
            {{end}}
        </tbody>
    </table>
</section>

{{end}}
